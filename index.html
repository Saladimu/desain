<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Inventory</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #e2e8f0;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --danger-dark: #b91c1c;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 20px 24px;
  }
  header h1 { font-size: 22px; font-weight: 700; }
  header p { font-size: 14px; opacity: 0.85; margin-top: 2px; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .stat .num { font-size: 26px; font-weight: 700; color: var(--primary); }
  .stat .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin-bottom: 16px; }
  .form-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .form-head h2 { margin-bottom: 0; }
  .link-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--primary);
    cursor: pointer;
  }
  .link-btn:hover { background: var(--bg); }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .date-wrap { display: flex; gap: 6px; }
  .date-wrap input { flex: 1; }
  .date-wrap .today-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .date-wrap .today-btn:hover { border-color: var(--primary); color: var(--primary); }
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    z-index: 50;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .modal h2 { font-size: 17px; margin-bottom: 16px; }
  .modal .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .modal .add-row input { flex: 1; }
  .modal ul { list-style: none; }
  .modal ul li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
  }
  .modal ul li .name { font-size: 14px; font-weight: 500; }
  .modal ul li .count { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .modal ul li .row-actions { display: flex; gap: 6px; }
  .modal ul li .row-actions button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .modal ul li .row-actions button:hover { border-color: var(--primary); color: var(--primary); }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  form label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
  }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .btn {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: var(--primary);
  }
  .btn:hover { background: var(--primary-dark); }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: var(--danger-dark); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--bg); color: var(--text); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar input[type="search"] { max-width: 280px; }
  .toolbar select { width: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  td .actions { display: flex; gap: 6px; }
  td .actions button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  td .actions button.edit:hover { border-color: var(--primary); color: var(--primary); }
  td .actions button.del:hover { border-color: var(--danger); color: var(--danger); }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    background: #e0e7ff;
    color: var(--primary-dark);
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .total-value { font-size: 16px; font-weight: 700; color: var(--text); }
  @media (max-width: 600px) {
    table { display: block; overflow-x: auto; white-space: nowrap; }
  }
</style>
</head>
<body>
<header>
  <h1>Home Inventory</h1>
  <p>Track your belongings for insurance and peace of mind</p>
</header>
<main>
  <div class="stats">
    <div class="stat"><div class="num" id="statItems">0</div><div class="label">Items</div></div>
    <div class="stat"><div class="num" id="statRooms">0</div><div class="label">Rooms</div></div>
    <div class="stat"><div class="num" id="statValue">$0</div><div class="label">Total Value</div></div>
  </div>

  <div class="card">
    <div class="form-head">
      <h2 id="formTitle">Add Item</h2>
      <button type="button" class="link-btn" id="manageCats">Manage Categories</button>
    </div>
    <form id="itemForm">
      <div>
        <label for="name">Item name</label>
        <input type="text" id="name" required maxlength="80" placeholder="Sofa, TV, laptop...">
      </div>
      <div>
        <label for="category">Category</label>
        <select id="category"></select>
      </div>
      <div>
        <label for="room">Room / Location</label>
        <input type="text" id="room" placeholder="Living room">
      </div>
      <div>
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" min="1" value="1">
      </div>
      <div>
        <label for="value">Value ($)</label>
        <input type="number" id="value" min="0" step="0.01" placeholder="0.00">
      </div>
      <div>
        <label for="date">Date (DD-MMM-YY)</label>
        <div class="date-wrap">
          <input type="text" id="date" maxlength="9" placeholder="05-Aug-26" inputmode="text">
          <button type="button" class="today-btn" id="todayBtn">Today</button>
        </div>
      </div>
      <div>
        <label for="notes">Notes</label>
        <input type="text" id="notes" maxlength="120" placeholder="Serial #, receipt, etc.">
      </div>
      <div style="display:flex; gap:8px; align-items:flex-end;">
        <button type="submit" class="btn" id="submitBtn">Add Item</button>
        <button type="button" class="btn-ghost" id="cancelEdit" style="display:none;">Cancel</button>
      </div>
    </form>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search items...">
    <select id="filterCat">
      <option value="">All categories</option>
    </select>
    <select id="sortBy">
      <option value="name">Sort: Name</option>
      <option value="value">Sort: Value</option>
      <option value="room">Sort: Room</option>
      <option value="added">Sort: Date added</option>
    </select>
  </div>

  <div class="card" style="padding: 8px 16px 16px;">
    <table>
      <thead>
        <tr><th>Item</th><th>Category</th><th>Room</th><th>Date</th><th>Qty</th><th>Value</th><th></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">No items yet. Add your first item above.</div>
    <div class="foot">
      <span class="muted" id="count"></span>
      <span class="total-value" id="totalValue"></span>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="catModal">
  <div class="modal">
    <h2>Manage Categories</h2>
    <div class="add-row">
      <input type="text" id="newCatName" maxlength="40" placeholder="New category name">
      <button type="button" class="btn" id="addCatBtn">Add</button>
    </div>
    <ul id="catList"></ul>
    <div class="foot">
      <button type="button" class="btn-ghost" id="closeCatModal">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'home_inventory_items';
  const CAT_KEY = 'home_inventory_categories';
  const DEFAULT_CATS = ['Furniture','Electronics','Kitchen','Clothing','Appliances','Jewelry','Tools','Books','Sports','Other'];

  let items = load(STORAGE_KEY, []);
  let categories = load(CAT_KEY, DEFAULT_CATS);
  let editingId = null;

  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function save(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
  }

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  const form = document.getElementById('itemForm');
  const searchInput = document.getElementById('search');
  const filterCat = document.getElementById('filterCat');
  const sortBy = document.getElementById('sortBy');
  const catSelect = document.getElementById('category');

  function populateCategorySelects(keep) {
    catSelect.innerHTML = '';
    filterCat.innerHTML = '<option value="">All categories</option>';
    categories.forEach(function (c) {
      catSelect.insertAdjacentHTML('beforeend', '<option>' + escapeHtml(c) + '</option>');
      filterCat.insertAdjacentHTML('beforeend', '<option>' + escapeHtml(c) + '</option>');
    });
    if (keep) catSelect.value = keep;
  }

  function money(n) {
    return Number(n || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
  }

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function formatDate(d) {
    if (!d) return '';
    const dd = String(d.getDate()).padStart(2, '0');
    return dd + '-' + MONTHS[d.getMonth()] + '-' + String(d.getFullYear()).slice(-2);
  }

  function parseDate(str) {
    if (!str) return '';
    str = str.trim();
    const m = str.match(/^(\d{2})-([A-Za-z]{3})-(\d{2})$/);
    if (!m) return str;
    const monthIdx = MONTHS.indexOf(m[2].charAt(0).toUpperCase() + m[2].slice(1).toLowerCase());
    if (monthIdx === -1) return str;
    const day = parseInt(m[1], 10);
    const year = 2000 + parseInt(m[3], 10);
    const d = new Date(year, monthIdx, day);
    if (d.getDate() !== day || d.getMonth() !== monthIdx) return str;
    return formatDate(d);
  }

  function normalizeDate(str) {
    return parseDate(str);
  }

  function visibleItems() {
    const q = searchInput.value.trim().toLowerCase();
    const cat = filterCat.value;
    const sort = sortBy.value;
    let list = items.filter(function (it) {
      const matchQ = !q || it.name.toLowerCase().indexOf(q) !== -1 || (it.room || '').toLowerCase().indexOf(q) !== -1 || (it.notes || '').toLowerCase().indexOf(q) !== -1;
      const matchC = !cat || it.category === cat;
      return matchQ && matchC;
    });
    list.sort(function (a, b) {
      if (sort === 'value') return (b.value || 0) - (a.value || 0);
      if (sort === 'room') return (a.room || '').localeCompare(b.room || '');
      if (sort === 'added') return (b.added || 0) - (a.added || 0);
      return a.name.localeCompare(b.name);
    });
    return list;
  }

  function render() {
    const list = visibleItems();
    tbody.innerHTML = '';
    list.forEach(function (it) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><strong>' + escapeHtml(it.name) + '</strong></td>' +
        '<td><span class="badge">' + escapeHtml(it.category || 'Other') + '</span></td>' +
        '<td>' + escapeHtml(it.room || '-') + '</td>' +
        '<td>' + escapeHtml(it.date || '-') + '</td>' +
        '<td>' + (it.quantity || 1) + '</td>' +
        '<td>' + money(it.value) + '</td>' +
        '<td><div class="actions">' +
          '<button class="edit" data-id="' + it.id + '">Edit</button>' +
          '<button class="del" data-id="' + it.id + '">Delete</button>' +
        '</div></td>';
      tbody.appendChild(tr);
    });
    empty.style.display = list.length ? 'none' : 'block';

    const totalValue = items.reduce(function (s, it) { return s + Number(it.value || 0); }, 0);
    const rooms = new Set(items.map(function (it) { return it.room; }).filter(Boolean));
    document.getElementById('statItems').textContent = items.length;
    document.getElementById('statRooms').textContent = rooms.size;
    document.getElementById('statValue').textContent = money(totalValue);
    document.getElementById('count').textContent = list.length + ' of ' + items.length + ' items';
    document.getElementById('totalValue').textContent = 'Total: ' + money(totalValue);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const data = {
      name: document.getElementById('name').value.trim(),
      category: document.getElementById('category').value,
      room: document.getElementById('room').value.trim(),
      quantity: parseInt(document.getElementById('quantity').value, 10) || 1,
      value: parseFloat(document.getElementById('value').value) || 0,
      date: normalizeDate(document.getElementById('date').value),
      notes: document.getElementById('notes').value.trim()
    };
    if (!data.name) return;

    if (editingId) {
      const idx = items.findIndex(function (it) { return it.id === editingId; });
      if (idx !== -1) {
        items[idx] = Object.assign({}, items[idx], data);
      }
      editingId = null;
      document.getElementById('formTitle').textContent = 'Add Item';
      document.getElementById('submitBtn').textContent = 'Add Item';
      document.getElementById('cancelEdit').style.display = 'none';
    } else {
      data.id = uid();
      data.added = Date.now();
      items.push(data);
    }
    save(STORAGE_KEY, items);
    form.reset();
    document.getElementById('quantity').value = 1;
    render();
  });

  tbody.addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    const item = items.find(function (it) { return it.id === id; });
    if (!item) return;

    if (btn.classList.contains('del')) {
      if (confirm('Delete "' + item.name + '"?')) {
        items = items.filter(function (it) { return it.id !== id; });
        if (editingId === id) resetForm();
        save(STORAGE_KEY, items);
        render();
      }
    } else if (btn.classList.contains('edit')) {
      editingId = id;
      document.getElementById('name').value = item.name;
      document.getElementById('category').value = item.category;
      document.getElementById('room').value = item.room || '';
      document.getElementById('quantity').value = item.quantity || 1;
      document.getElementById('value').value = item.value || '';
      document.getElementById('date').value = item.date || '';
      document.getElementById('notes').value = item.notes || '';
      document.getElementById('formTitle').textContent = 'Edit Item';
      document.getElementById('submitBtn').textContent = 'Save Changes';
      document.getElementById('cancelEdit').style.display = 'inline-block';
      document.getElementById('name').focus();
    }
  });

  function resetForm() {
    editingId = null;
    form.reset();
    document.getElementById('quantity').value = 1;
    document.getElementById('formTitle').textContent = 'Add Item';
    document.getElementById('submitBtn').textContent = 'Add Item';
    document.getElementById('cancelEdit').style.display = 'none';
  }

  document.getElementById('cancelEdit').addEventListener('click', resetForm);
  searchInput.addEventListener('input', render);
  filterCat.addEventListener('change', render);
  sortBy.addEventListener('change', render);

  document.getElementById('todayBtn').addEventListener('click', function () {
    document.getElementById('date').value = formatDate(new Date());
  });

  function categoryCount(name) {
    return items.filter(function (it) { return it.category === name; }).length;
  }

  function renderCatList() {
    const list = document.getElementById('catList');
    list.innerHTML = '';
    categories.forEach(function (c) {
      const li = document.createElement('li');
      li.innerHTML =
        '<span><span class="name">' + escapeHtml(c) + '</span><span class="count">' + categoryCount(c) + ' item(s)</span></span>' +
        '<span class="row-actions">' +
          '<button class="ren" data-name="' + escapeHtml(c) + '">Rename</button>' +
          '<button class="cat-del" data-name="' + escapeHtml(c) + '">Delete</button>' +
        '</span>';
      list.appendChild(li);
    });
  }

  function openCatModal() {
    renderCatList();
    document.getElementById('catModal').classList.add('open');
  }

  function closeCatModal() {
    document.getElementById('catModal').classList.remove('open');
    document.getElementById('newCatName').value = '';
  }

  document.getElementById('manageCats').addEventListener('click', openCatModal);
  document.getElementById('closeCatModal').addEventListener('click', closeCatModal);
  document.getElementById('catModal').addEventListener('click', function (e) {
    if (e.target === this) closeCatModal();
  });

  function addCategory(name) {
    name = name.trim();
    if (!name) return;
    if (categories.indexOf(name) !== -1) {
      alert('Category "' + name + '" already exists.');
      return;
    }
    categories.push(name);
    save(CAT_KEY, categories);
    populateCategorySelects(catSelect.value);
    renderCatList();
  }

  document.getElementById('addCatBtn').addEventListener('click', function () {
    addCategory(document.getElementById('newCatName').value);
    document.getElementById('newCatName').value = '';
    document.getElementById('newCatName').focus();
  });
  document.getElementById('newCatName').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      addCategory(this.value);
      this.value = '';
    }
  });

  document.getElementById('catList').addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const name = btn.getAttribute('data-name');

    if (btn.classList.contains('cat-del')) {
      if (confirm('Delete category "' + name + '"? Items in it will be moved to "Other".')) {
        categories = categories.filter(function (c) { return c !== name; });
        items = items.map(function (it) {
          if (it.category === name) it.category = 'Other';
          return it;
        });
        save(CAT_KEY, categories);
        save(STORAGE_KEY, items);
        if (catSelect.value === name) catSelect.value = 'Other';
        populateCategorySelects(catSelect.value);
        renderCatList();
        render();
      }
    } else if (btn.classList.contains('ren')) {
      const newName = prompt('Rename "' + name + '" to:', name);
      if (!newName || newName.trim() === name) return;
      const clean = newName.trim();
      if (!clean) return;
      if (categories.indexOf(clean) !== -1) {
        alert('Category "' + clean + '" already exists.');
        return;
      }
      categories = categories.map(function (c) { return c === name ? clean : c; });
      items = items.map(function (it) {
        if (it.category === name) it.category = clean;
        return it;
      });
      save(CAT_KEY, categories);
      save(STORAGE_KEY, items);
      populateCategorySelects(catSelect.value);
      renderCatList();
      render();
    }
  });

  populateCategorySelects();
  render();
})();
</script>
</body>
</html>
